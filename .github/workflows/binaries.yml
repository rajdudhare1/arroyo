name: Build Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    branches:
      - '*_build'

env:
  REFINERY_CONFIG: postgres://arroyo:arroyo@localhost:5432/arroyo
  REFINERY_VERSION: 0.8.14
  PROTOC_VERSION: 27.3

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node + pnpm (same as other jobs)
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.1 }

      # Rust
      - uses: dtolnay/rust-toolchain@stable

      # Python for PyO3
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Point PyO3 to this Python
        shell: pwsh
        run: echo "PYO3_PYTHON=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

      # protoc
      - name: Install protoc compiler
        shell: pwsh
        run: |
          $ver = "${{ env.PROTOC_VERSION }}"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/protoc-$ver-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath protoc
          echo "$pwd\protoc\bin" >> $env:GITHUB_PATH

      # PostgreSQL with a known password for 'postgres'
      - name: Install PostgreSQL 14
        shell: pwsh
        run: |
          choco install postgresql14 --params '/Password:arroyo' -y --no-progress
          echo "C:\Program Files\PostgreSQL\14\bin" >> $env:GITHUB_PATH

      # Create user/db (idempotent), force IPv4 to avoid ::1 auth quirks
      - name: Init DB (user/db for Arroyo)
        shell: pwsh
        env:
          PGPASSWORD: arroyo
        run: |
          $pgBin = "C:\Program Files\PostgreSQL\14\bin"
          & "$pgBin\pg_isready.exe" -h 127.0.0.1 -p 5432
          & "$pgBin\psql.exe" -U postgres -h 127.0.0.1 -d postgres -c "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='arroyo') THEN CREATE ROLE arroyo LOGIN PASSWORD 'arroyo' SUPERUSER; END IF; END $$;"
          $dbExists = & "$pgBin\psql.exe" -U postgres -h 127.0.0.1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='arroyo'"
          if (-not $dbExists) { & "$pgBin\createdb.exe" -U postgres -h 127.0.0.1 arroyo }

      - name: Run DB migrations
        shell: pwsh
        env:
          REFINERY_CONFIG: postgres://arroyo:arroyo@localhost:5432/arroyo
        run: |
          cargo install --debug refinery_cli --version $env:REFINERY_VERSION
          refinery migrate -e REFINERY_CONFIG -p crates/arroyo-api/migrations

      - name: Build frontend
        shell: pwsh
        run: |
          cd webui
          pnpm install
          pnpm build

      - name: Create output directory
        shell: pwsh
        run: mkdir artifacts

      - name: Build Arroyo with Python
        shell: pwsh
        run: |
          cargo build --features python --release --package arroyo
          Copy-Item target\release\arroyo.exe artifacts\arroyo-python.exe

      - name: Build Arroyo without Python
        shell: pwsh
        run: |
          cargo build --release --package arroyo
          Copy-Item target\release\arroyo.exe artifacts\arroyo.exe

      - uses: actions/upload-artifact@v4
        with:
          name: arroyo-windows-x86_64
          path: artifacts/*
          if-no-files-found: error
  linux:
    strategy:
      fail-fast: true
      matrix:
        # see https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        config:
          - { runner: ubuntu-22.04-32, protoc: linux-x86_64, python_arch: x64, artifact: linux-x86_64 }
          - { runner: ubuntu-22.04-32-arm, protoc: linux-aarch_64, python_arch: arm64, artifact: linux-arm64 }
    runs-on: ${{ matrix.config.runner }}
    services:
      postgres:
        image: postgres:14.13-alpine3.20
        env:
          POSTGRES_USER: arroyo
          POSTGRES_PASSWORD: arroyo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
      - name: Install protoc compiler
        run: |
          wget https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-${{ matrix.config.protoc }}.zip
          unzip protoc*.zip && sudo mv bin/protoc /usr/local/bin
      - name: Update rust
        run: |
          rustup update
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.config.python_arch }}
      - name: Run DB migrations
        run: |          
          cargo install --debug refinery_cli --version $REFINERY_VERSION
          refinery migrate -e REFINERY_CONFIG -p crates/arroyo-api/migrations
      - name: Run frontend build
        run: cd webui && pnpm install && pnpm build
      - name: Create output directory
        run: mkdir artifacts
      - name: Build Arroyo with Python
        run: PYO3_PYTHON="$pythonLocation/bin/python3" LD_LIBRARY_PATH="$pythonLocation/lib:${LD_LIBRARY_PATH:-}" cargo build --features python --release --package arroyo && strip target/release/arroyo && mv target/release/arroyo artifacts/arroyo-python
      - name: Build Arroyo without Python
        run: cargo build --release --package arroyo && strip target/release/arroyo && mv target/release/arroyo artifacts/arroyo
      - uses: actions/upload-artifact@v4
        with:
          name: arroyo-${{ matrix.config.artifact }}
          path: artifacts/*
          if-no-files-found: error

  macos:
    env:
      CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    strategy:
      fail-fast: true
      matrix:
        # see https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        config:
          - { runner: macos-14-large, protoc: osx-x86_64, artifact: macos-x86_64 }
          - { runner: macos-14-xlarge, protoc: osx-aarch_64, artifact: macos-m1 }
    runs-on: ${{ matrix.config.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
      - name: Install Python 3.12 via homebrew
        run: |
          set -euxo pipefail
          # macOS runners come with a python.org install that leaves conflicting
          # /usr/local/bin symlinks; overwrite them so Homebrew can link cleanly.
          if ! brew install python@3.12; then
            brew link --overwrite python@3.12
          fi
          brew list python@3.12 >/dev/null
      - name: Install CMake 3.29
        run: |
          set -euxo pipefail
          CMAKE_VERSION=3.29.6
          CMAKE_DIR="$RUNNER_TEMP/cmake-$CMAKE_VERSION"
          mkdir -p "$CMAKE_DIR"
          curl -L "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-macos-universal.tar.gz" -o "$RUNNER_TEMP/cmake.tar.gz"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$CMAKE_DIR" --strip-components=1
          echo "$CMAKE_DIR/CMake.app/Contents/bin" >> "$GITHUB_PATH"
      - name: Install protoc compiler
        run: |
          wget https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-${{ matrix.config.protoc }}.zip
          unzip protoc*.zip && sudo mv bin/protoc /usr/local/bin
      - name: Install Postgres and prepare DB
        run: |
          brew install postgresql@14 && brew services start postgresql && sleep 10
          psql postgres -c "CREATE USER arroyo WITH PASSWORD 'arroyo' SUPERUSER;"
          createdb arroyo
      - name: Run DB migrations
        run: |
          cargo install --debug refinery_cli --version $REFINERY_VERSION
          refinery migrate -e REFINERY_CONFIG -p crates/arroyo-api/migrations
      - name: Run frontend build
        run: cd webui && pnpm install && pnpm build
      - name: Create output directory
        run: mkdir artifacts
      - name: Build Arroyo with Python
        run: PYO3_PYTHON=$(brew --prefix python@3.12)/Frameworks/Python.framework/Versions/3.12/bin/python3.12 cargo build --features python --release --package arroyo && strip target/release/arroyo && mv target/release/arroyo artifacts/arroyo-python
      - name: Build Arroyo without Python
        run: cargo build --release --package arroyo && strip target/release/arroyo && mv target/release/arroyo artifacts/arroyo
      - uses: actions/upload-artifact@v4
        with:
          name: arroyo-${{ matrix.config.artifact }}
          path: artifacts/*
          if-no-files-found: error
